name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qgis:
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.34: Qt5, close to the oldest supported release
        # ltr:  current long-term release
        # stable: latest release (QGIS 4, Qt6)
        qgis: ["3.34", "ltr", "stable"]
    # Official QGIS images: no apt install of QGIS on the runner.
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: |
          python3 -c "from qgis.core import Qgis; print('QGIS', Qgis.version())"
          python3 -c "from qgis.PyQt.QtCore import QT_VERSION_STR; print('Qt', QT_VERSION_STR)"

      - name: Install pytest
        run: |
          python3 -c "import pytest" 2>/dev/null || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -o Acquire::Retries=3
            apt-get install -y --no-install-recommends -o Acquire::Retries=3 python3-pytest
          }

      - name: Run tests
        run: python3 -m pytest tests -v -p no:cacheprovider

  # The same two checks plugins.qgis.org runs on an uploaded plugin.
  qt6:
    name: Qt6 compatibility (QGIS checker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: qgis/qgis:stable
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Get the checker
        run: |
          # The checker imports these PyQt6 modules; the QGIS image may lack some.
          missing=""
          for pair in QtQuickWidgets:python3-pyqt6.qtquick QtSvg:python3-pyqt6.qtsvg Qsci:python3-pyqt6.qsci; do
            module=${pair%%:*}; package=${pair#*:}
            python3 -c "from PyQt6 import $module" 2>/dev/null || missing="$missing $package"
          done
          if [ -n "$missing" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -o Acquire::Retries=3
            apt-get install -y --no-install-recommends -o Acquire::Retries=3 $missing
          fi
          python3 -c "import tokenize_rt" 2>/dev/null \
            || python3 -m pip install --break-system-packages tokenize-rt \
            || { apt-get update && apt-get install -y --no-install-recommends python3-tokenize-rt; }
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/qgis/QGIS/master/scripts/pyqt5_to_pyqt6/pyqt5_to_pyqt6.py', '/tmp/pyqt5_to_pyqt6.py')"

      - name: Check for Qt5-only code
        run: |
          python3 /tmp/pyqt5_to_pyqt6.py --dry_run --logfile /tmp/qt6.log .
          cat /tmp/qt6.log
          # --dry_run always exits 0, so fail on any reported issue
          if grep -E '\.py:[0-9]+:[0-9]+ - ' /tmp/qt6.log; then
            echo "::error::Qt6 compatibility issues found (see above)"
            exit 1
          fi

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit
      - name: Scan plugin code
        run: bandit -r . -x ./tests,./.git
